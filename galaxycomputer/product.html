<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product details | Galaxy Computers & Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <div class="border-b border-white/10 bg-slate-900/90 py-3 text-sm text-slate-200">
      <div class="mx-auto flex max-w-7xl items-center justify-between px-4 text-slate-300 sm:px-6">
        <p id="announcement-text" class="truncate"></p>
        <a href="home.html" class="text-emerald-400 hover:text-emerald-200">Back to store</a>
      </div>
    </div>

    <main class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
      <div id="product-container" class="grid gap-8 lg:grid-cols-[1.2fr_0.8fr]"></div>
      <div id="product-message" class="mt-6 rounded-3xl border border-slate-700 bg-slate-900/80 p-8 text-center text-slate-300 hidden"></div>
    </main>

        <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAhytccILI1rZIaafATkf3zZujxrXE2QoU",
        authDomain: "alaxycomputers.firebaseapp.com",
        databaseURL: "https://alaxycomputers-default-rtdb.firebaseio.com",
        projectId: "alaxycomputers",
        storageBucket: "alaxycomputers.firebasestorage.app",
        messagingSenderId: "96681808644",
        appId: "1:96681808644:web:4639ca57cbc9f82e38b651",
        measurementId: "G-YZEB0M41NC"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      function formatPrice(value) {
        return new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(value || 0);
      }

      function getProductIdFromQuery() {
        return new URLSearchParams(window.location.search).get('id');
      }

      function updateAnnouncementText(text) {
        const announcement = document.getElementById('announcement-text');
        if (announcement) {
          announcement.textContent = text || 'Discover certified refurbished laptops, desktops and accessories at great prices.';
        }
      }

      function showMessage(message) {
        const messageContainer = document.getElementById('product-message');
        messageContainer.textContent = message;
        messageContainer.classList.remove('hidden');
      }

      function buildImageGallery(images, selectedIndex = 0) {
        const mainImage = images[selectedIndex] || images[0] || '';
        return `
          <div class="space-y-4">
            <div class="overflow-hidden rounded-[32px] border border-slate-700 bg-slate-900 shadow-lg">
              <img id="main-product-image" src="${mainImage}" alt="Product image" class="h-[420px] w-full object-cover sm:h-[520px]" />
            </div>
            <div class="grid grid-cols-3 gap-3 sm:grid-cols-4">
              ${images.map((image, index) => `
                <button type="button" data-image-index="${index}" class="overflow-hidden rounded-3xl border border-slate-700 bg-slate-900 transition hover:border-emerald-400 focus:outline-none focus:ring-2 focus:ring-emerald-400/60">
                  <img src="${image}" alt="Thumbnail ${index + 1}" class="h-24 w-full object-cover" />
                </button>
              `).join('')}
            </div>
          </div>
        `;
      }

      function renderProduct(product) {
        const container = document.getElementById('product-container');
        const images = Array.isArray(product.images) && product.images.length ? product.images : [product.imageUrl].filter(Boolean);
        const whatsappText = encodeURIComponent(`Hello! I would like to enquire about ${product.name}. Price: ${formatPrice(product.price)}.`);
        const whatsappLink = `https://wa.me/919194205024?text=${whatsappText}`;

        container.innerHTML = `
          <section class="rounded-[32px] border border-slate-700 bg-slate-900/80 p-6 shadow-2xl backdrop-blur sm:p-8">
            <div class="mb-6 flex flex-wrap items-center gap-3 text-sm text-slate-400">
              <span class="rounded-full border border-slate-700 px-3 py-1">${product.category || 'Product'}</span>
              <span class="rounded-full border border-slate-700 px-3 py-1">${product.brand || 'Brand'}</span>
              <span class="rounded-full border border-slate-700 px-3 py-1">${product.stock || 'In Stock'}</span>
            </div>
            ${buildImageGallery(images)}
          </section>
          <aside class="space-y-6 rounded-[32px] border border-slate-700 bg-slate-900/85 p-6 shadow-2xl backdrop-blur sm:p-8">
            <div class="space-y-4">
              <div>
                <p class="text-sm uppercase tracking-[0.3em] text-emerald-400">${product.condition || 'Refurbished'}</p>
                <h1 class="mt-3 text-3xl font-semibold text-white">${product.name}</h1>
              </div>
              <div class="flex items-end gap-4">
                <p class="text-4xl font-semibold text-white">${formatPrice(product.price)}</p>
                ${product.originalPrice ? `<p class="text-sm text-slate-400 line-through">${formatPrice(product.originalPrice)}</p>` : ''}
              </div>
              <p class="text-sm leading-7 text-slate-300">${product.description || 'This product is fully tested and backed by our certified refurbished guarantee.'}</p>
            </div>
            <div class="grid gap-3 rounded-3xl border border-slate-700 bg-slate-950/70 p-5">
              <div class="flex items-center justify-between text-sm text-slate-400">
                <span>Warranty</span>
                <span>${product.warrantyMonths ? `${product.warrantyMonths} months` : 'No warranty'}</span>
              </div>
              <div class="flex items-center justify-between text-sm text-slate-400">
                <span>Accessories</span>
                <span>${product.accessories || 'Charger included'}</span>
              </div>
              <div class="flex items-center justify-between text-sm text-slate-400">
                <span>Condition</span>
                <span>${product.condition || 'Good'}</span>
              </div>
            </div>
            <div class="space-y-3">
              <a href="${whatsappLink}" target="_blank" rel="noopener noreferrer" class="block rounded-full bg-emerald-500 px-5 py-3 text-center text-sm font-semibold text-slate-950 transition hover:bg-emerald-400">Enquire on WhatsApp</a>
              <button id="add-to-favorites" type="button" class="w-full rounded-full border border-slate-700 px-5 py-3 text-sm font-semibold text-white transition hover:border-emerald-400">Save for later</button>
            </div>
          </aside>
        `;

        document.querySelectorAll('[data-image-index]').forEach((button) => {
          button.addEventListener('click', () => {
            const index = Number(button.getAttribute('data-image-index'));
            const mainImage = document.getElementById('main-product-image');
            if (mainImage && images[index]) {
              mainImage.src = images[index];
            }
          });
        });

        const favoritesButton = document.getElementById('add-to-favorites');
        if (favoritesButton) {
          favoritesButton.addEventListener('click', () => {
            setTimeout(() => {
              favoritesButton.textContent = 'Saved to favorites';
              favoritesButton.classList.remove('border-slate-700');
              favoritesButton.classList.add('border-emerald-400', 'bg-slate-800', 'text-emerald-300');
            }, 50);
          });
        }
      }

      async function loadProduct() {
        const productId = getProductIdFromQuery();
        if (!productId) {
          showMessage('No product selected. Please return to the store and choose a product to view.');
          return;
        }

        const cachedProducts = localStorage.getItem('gc_products');
        let storedProducts = [];
        if (cachedProducts) {
          try {
            storedProducts = JSON.parse(cachedProducts);
          } catch (error) {
            console.warn('Could not parse local products cache.', error);
          }
        }

        let product = storedProducts.find((item) => String(item.id) === productId);
        if (product) {
          renderProduct(product);
          return;
        }

        try {
          const snapshot = await getDocs(collection(db, 'products'));
          const firestoreProducts = snapshot.docs.map((docItem) => ({ ...docItem.data(), id: docItem.id }));
          if (firestoreProducts.length) {
            const updatedCache = JSON.stringify(firestoreProducts);
            localStorage.setItem('gc_products', updatedCache);
            product = firestoreProducts.find((item) => String(item.id) === productId);
            if (product) {
              renderProduct(product);
              return;
            }
          }
        } catch (error) {
          console.warn('Firestore lookup failed:', error.message);
        }

        if (storedProducts.length) {
          product = storedProducts.find((item) => String(item.id) === productId);
        }

        if (!product) {
          showMessage('We could not find that product. It may have been removed or the link may be invalid. Please return to the store to browse available items.');
        } else {
          renderProduct(product);
        }
      }

      document.addEventListener('DOMContentLoaded', () => {
        const announcementText = localStorage.getItem('gc_announcement_text');
        updateAnnouncementText(announcementText);
        loadProduct();
      });
    </script>

  </body>
</html>
