<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | Galaxy Computers & Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body class="bg-slate-100 text-slate-800">
    <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
      <div class="flex flex-col gap-4 rounded-[28px] border border-slate-200 bg-white p-5 shadow-sm md:flex-row md:items-center md:justify-between">
        <div>
          <p class="text-sm font-semibold uppercase tracking-[0.2em] text-emerald-700">Admin dashboard</p>
          <h1 class="text-2xl font-semibold text-slate-900">Manage Galaxy Computers & Services inventory</h1>
        </div>
        <div class="flex items-center gap-3">
          <a href="../home.html" class="rounded-full border border-slate-300 px-4 py-2 text-sm font-semibold text-slate-700 transition hover:border-emerald-500 hover:text-emerald-700">View store</a>
          <button id="logout-btn" class="rounded-full bg-slate-900 px-4 py-2 text-sm font-semibold text-white transition hover:bg-slate-700">Log out</button>
        </div>
      </div>

      <div class="mt-6 grid grid-cols-1 gap-6 lg:grid-cols-[1.15fr_0.85fr]">
        <section class="rounded-[28px] border border-slate-200 bg-white p-5 shadow-sm">
          <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
            <h2 class="text-lg font-semibold text-slate-900">Add or edit product</h2>
            <button id="reset-form" type="button" class="w-full rounded-full border border-emerald-700 px-4 py-2 text-sm font-semibold text-emerald-700 transition hover:bg-emerald-50 sm:w-auto">Clear form</button>
          </div>
          <form id="product-form" class="mt-6 space-y-3">
            <input id="product-id" type="hidden" />
            <input id="product-name" required placeholder="Product name" class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-emerald-500" />
            <div class="grid gap-3 md:grid-cols-2">
              <select id="product-category" required class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-emerald-500"></select>
              <input id="product-brand" placeholder="Brand" class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-emerald-500" />
            </div>
            <div class="grid gap-3 md:grid-cols-3">
              <input id="product-price" required type="number" min="0" placeholder="Price" class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-emerald-500" />
              <input id="product-original-price" type="number" min="0" placeholder="Original price" class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-emerald-500" />
              <input id="product-warranty" type="number" min="0" placeholder="Warranty months" class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-emerald-500" />
            </div>
            <div class="space-y-3">
              <label class="block text-sm font-medium text-slate-700">Upload product images</label>
              <input id="product-image-upload" type="file" accept="image/*" multiple class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-emerald-500" />
              <div id="image-upload-status" class="text-sm text-slate-500">Select one or more images to upload directly from your computer.</div>
            </div>
            <div class="grid gap-3 md:grid-cols-2">
              <input id="product-image" placeholder="Main image URL" class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-emerald-500" />
              <input id="product-images" placeholder="Extra image URLs (comma separated)" class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-emerald-500" />
            </div>
            <textarea id="product-specs" rows="4" placeholder="Specs (one per line or comma separated)" class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-emerald-500"></textarea>
            <textarea id="product-description" rows="3" placeholder="Short description" class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-emerald-500"></textarea>
            <input id="product-accessories" placeholder="Accessories included" class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-emerald-500" />
            <div class="grid gap-3 md:grid-cols-3">
              <select id="product-condition" class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-emerald-500">
                <option>Excellent</option>
                <option>Good</option>
                <option>Fair</option>
              </select>
              <select id="product-stock" class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-emerald-500">
                <option value="In Stock">In Stock</option>
                <option value="Limited">Limited</option>
                <option value="Out of Stock">Out of Stock</option>
              </select>
              <select id="product-featured" class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-emerald-500">
                <option value="true">Featured</option>
                <option value="false">Normal</option>
              </select>
            </div>
            <div class="grid gap-3 md:grid-cols-2">
              <label class="flex items-center gap-2 rounded-2xl border border-slate-200 px-4 py-3 text-sm text-slate-700"><input id="product-new" type="checkbox" checked /> New arrival</label>
              <label class="flex items-center gap-2 rounded-2xl border border-slate-200 px-4 py-3 text-sm text-slate-700"><input id="product-deal" type="checkbox" /> Best deal</label>
            </div>
            <div id="save-status" class="rounded-2xl border border-emerald-100 bg-emerald-50 px-4 py-3 text-sm text-emerald-700"></div>
            <button id="save-product-btn" type="submit" class="w-full rounded-full bg-emerald-600 px-5 py-3 text-sm font-semibold text-white transition hover:bg-emerald-700 disabled:cursor-not-allowed disabled:opacity-60">Save product</button>
          </form>
        </section>

        <div class="space-y-6">
          <section class="rounded-[28px] border border-slate-200 bg-white p-5 shadow-sm">
            <div class="flex items-center justify-between">
              <h2 class="text-lg font-semibold text-slate-900">Site announcement</h2>
              <span class="text-sm text-slate-500">Top promo bar</span>
            </div>
            <div class="mt-4 space-y-3">
              <input id="announcement-input" class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-emerald-500" placeholder="Enter promo announcement" />
              <button id="save-announcement-btn" type="button" class="rounded-full bg-emerald-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-emerald-700">Save announcement</button>
              <p id="announcement-status" class="text-sm text-slate-500"></p>
            </div>
          </section>
          <section class="rounded-[28px] border border-slate-200 bg-white p-5 shadow-sm">
            <div class="flex items-center justify-between">
              <h2 class="text-lg font-semibold text-slate-900">Inventory list</h2>
              <span id="inventory-count" class="text-sm text-slate-500"></span>
            </div>
            <div id="inventory-list" class="mt-4 space-y-3"></div>
          </section>
        </div>
      </div>
    </div>

        <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
      import { getFirestore, collection, getDocs, doc, setDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAhytccILI1rZIaafATkf3zZujxrXE2QoU",
        authDomain: "alaxycomputers.firebaseapp.com",
        databaseURL: "https://alaxycomputers-default-rtdb.firebaseio.com",
        projectId: "alaxycomputers",
        storageBucket: "alaxycomputers.firebasestorage.app",
        messagingSenderId: "96681808644",
        appId: "1:96681808644:web:4639ca57cbc9f82e38b651",
        measurementId: "G-YZEB0M41NC"
      };
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);
      let products = [];
      const categories = ['Laptops', 'Monitors', 'Desktop PCs', 'Printers', 'Networking', 'Accessories'];
      const announcementInput = document.getElementById('announcement-input');
      const announcementStatus = document.getElementById('announcement-status');
      const imageKitPublicKey = 'public_3h7bX22/U6nsaADl0+siE/EUR3g=';
      const imageKitPrivateKey = 'private_c0DqLuievSIMYbVzZe3hyoQlbeY=';
      const imageKitUploadUrl = 'https://upload.imagekit.io/api/v1/files/upload';
      let uploadedImageUrls = [];
      const imageUploadStatus = document.getElementById('image-upload-status');

      function getSaveStatusElement() {
        return document.getElementById('save-status');
      }

      function getSaveButton() {
        return document.getElementById('save-product-btn');
      }

      function getBasicAuthHeader() {
        return `Basic ${btoa(`${imageKitPrivateKey}:`)}`;
      }

      async function uploadImageKitFile(file) {
        const formData = new FormData();
        formData.append('file', file);
        formData.append('fileName', file.name.replace(/\s+/g, '_'));
        formData.append('folder', '/galaxy-products');
        const response = await fetch(imageKitUploadUrl, {
          method: 'POST',
          headers: {
            Authorization: getBasicAuthHeader()
          },
          body: formData
        });

        if (!response.ok) {
          const responseText = await response.text();
          throw new Error(`ImageKit upload failed: ${response.status} ${responseText}`);
        }

        const data = await response.json();
        return data.url || data.filePath || '';
      }

      async function uploadSelectedFiles(files) {
        if (!imageUploadStatus) {
          return;
        }
        const fileArray = Array.from(files || []);
        if (fileArray.length === 0) {
          imageUploadStatus.textContent = 'No files selected.';
          imageUploadStatus.className = 'text-sm text-red-700';
          return;
        }

        imageUploadStatus.textContent = `Uploading ${fileArray.length} image(s)...`;
        imageUploadStatus.className = 'text-sm text-slate-500';

        try {
          const urls = [];
          for (const file of fileArray) {
            const imageUrl = await uploadImageKitFile(file);
            urls.push(imageUrl);
          }
          uploadedImageUrls = urls;
          if (urls.length > 0) {
            document.getElementById('product-image').value = urls[0];
            document.getElementById('product-images').value = urls.slice(1).join(', ');
            imageUploadStatus.textContent = `Uploaded ${urls.length} image(s). Main image and extra images are set automatically.`;
            imageUploadStatus.className = 'text-sm text-emerald-700';
          } else {
            imageUploadStatus.textContent = 'No images were uploaded.';
            imageUploadStatus.className = 'text-sm text-red-700';
          }
        } catch (uploadError) {
          console.error('Image upload failed:', uploadError);
          imageUploadStatus.textContent = `Upload failed: ${uploadError.message}`;
          imageUploadStatus.className = 'text-sm text-red-700';
        }
      }

      function persistProductsToLocal(updatedProducts) {
        products = updatedProducts;
        localStorage.setItem('gc_products', JSON.stringify(products));
        localStorage.setItem('gc_products_updated', Date.now().toString());
        window.dispatchEvent(new Event('gc_products_updated'));
      }

      function localAdminSessionExists() {
        return Boolean(localStorage.getItem('gc_admin_session'));
      }

      function setSaveStatus(message, tone = 'info') {
        const saveStatus = getSaveStatusElement();
        if (!saveStatus) {
          return;
        }
        saveStatus.textContent = message || '';
        saveStatus.className = 'rounded-2xl border px-4 py-3 text-sm';
        if (tone === 'success') {
          saveStatus.classList.add('border-emerald-200', 'bg-emerald-50', 'text-emerald-700');
        } else if (tone === 'warning') {
          saveStatus.classList.add('border-amber-200', 'bg-amber-50', 'text-amber-700');
        } else if (tone === 'error') {
          saveStatus.classList.add('border-red-200', 'bg-red-50', 'text-red-700');
        } else {
          saveStatus.classList.add('border-emerald-100', 'bg-emerald-50', 'text-emerald-700');
        }
      }

      function populateCategorySelect() {
        const select = document.getElementById('product-category');
        select.innerHTML = categories.map((category) => `<option value="${category}">${category}</option>`).join('');
      }

      async function loadAnnouncement() {
        const savedText = localStorage.getItem('gc_announcement_text');
        if (announcementInput) {
          announcementInput.value = savedText || '';
        }

        try {
          const docSnap = await getDocs(collection(db, 'site-settings'));
          const settingsDoc = docSnap.docs.find((item) => item.id === 'announcement');
          if (settingsDoc) {
            const text = settingsDoc.data().text || '';
            if (announcementInput) {
              announcementInput.value = text;
            }
            localStorage.setItem('gc_announcement_text', text);
            localStorage.setItem('gc_announcement_updated', Date.now().toString());
          }
        } catch (error) {
          console.warn('Could not load announcement from Firestore:', error.message);
        }
      }

      async function saveAnnouncement() {
        const text = announcementInput.value.trim();
        if (!text) {
          announcementStatus.textContent = 'Please enter an announcement first.';
          return;
        }
        try {
          await setDoc(doc(db, 'site-settings', 'announcement'), { text, updatedAt: Date.now() }, { merge: true });
          localStorage.setItem('gc_announcement_text', text);
          localStorage.setItem('gc_announcement_updated', Date.now().toString());
          announcementStatus.textContent = 'Announcement saved successfully! Changes will appear on the home page.';
          window.dispatchEvent(new Event('announcement-updated'));
        } catch (error) {
          console.warn('Could not save announcement to Firestore:', error.message);
          localStorage.setItem('gc_announcement_text', text);
          localStorage.setItem('gc_announcement_updated', Date.now().toString());
          announcementStatus.textContent = 'Saved locally, but Firestore sync failed.';
          window.dispatchEvent(new Event('announcement-updated'));
        }
      }

      function clearForm() {
        document.getElementById('product-form').reset();
        document.getElementById('product-id').value = '';
        document.getElementById('product-featured').value = 'true';
        document.getElementById('product-new').checked = true;
        document.getElementById('product-deal').checked = false;
        document.getElementById('product-category').value = categories[0];
        uploadedImageUrls = [];
        if (imageUploadStatus) {
          imageUploadStatus.textContent = 'Select one or more images to upload directly from your computer.';
          imageUploadStatus.className = 'text-sm text-slate-500';
        }
      }

      function formatPrice(value) {
        return new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(value || 0);
      }

      function withTimeout(promise, ms) {
        return Promise.race([
          promise,
          new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))
        ]);
      }

      async function loadProducts() {
        const cached = localStorage.getItem('gc_products');
        const hasCachedProducts = Boolean(cached);
        if (cached) {
          try {
            products = JSON.parse(cached);
            renderInventory();
          } catch (error) {
            console.warn('Could not parse cached products.', error);
            products = [];
          }
        }

        try {
          const snapshot = await getDocs(collection(db, 'products'));
          const firestoreProducts = snapshot.docs.map((docItem) => ({ ...docItem.data(), id: docItem.id }));
          if (firestoreProducts.length > 0) {
            persistProductsToLocal(firestoreProducts);
            renderInventory();
          } else if (!hasCachedProducts) {
            products = [];
            persistProductsToLocal([]);
            renderInventory();
          }
        } catch (error) {
          console.warn('Firestore connection failed:', error.message);
          if (!hasCachedProducts) {
            products = [];
            persistProductsToLocal([]);
            renderInventory();
          }
        }
      }

      function renderInventory() {
        const list = document.getElementById('inventory-list');
        const count = document.getElementById('inventory-count');
        count.textContent = `${products.length} items`;
        list.innerHTML = products.map((product) => `
          <div class="rounded-2xl border border-slate-200 bg-slate-50 p-3">
            <div class="flex items-start justify-between gap-3">
              <div>
                <p class="font-semibold text-slate-900">${product.name}</p>
                <p class="text-sm text-slate-500">${product.category} • ${product.brand || 'N/A'}</p>
              </div>
              <span class="rounded-full bg-white px-2 py-1 text-xs font-semibold text-slate-600">${product.stock || 'In Stock'}</span>
            </div>
            <div class="mt-3 flex flex-wrap gap-2">
              <button data-edit-product="${product.id}" class="rounded-full border border-slate-300 px-3 py-1.5 text-xs font-semibold text-slate-700">Edit</button>
              <button data-delete-product="${product.id}" class="rounded-full border border-red-200 px-3 py-1.5 text-xs font-semibold text-red-600">Delete</button>
              <button data-sold-product="${product.id}" class="rounded-full border border-amber-200 px-3 py-1.5 text-xs font-semibold text-amber-700">Mark out of stock</button>
            </div>
          </div>
        `).join('');
      }

      function buildProductPayload(formData) {
        const uploadedUrls = uploadedImageUrls.length ? uploadedImageUrls : [];
        const mainImage = formData.imageUrl || uploadedUrls[0] || '';
        const extraImages = (formData.images || '').split(',').map((item) => item.trim()).filter(Boolean);
        const images = [...new Set([...extraImages, ...(uploadedUrls.slice(mainImage ? 1 : 0)), ...(mainImage && !extraImages.includes(mainImage) ? [mainImage] : [])])].filter(Boolean);

        return {
          id: formData.id || `product-${Date.now()}`,
          name: formData.name,
          category: formData.category,
          brand: formData.brand || 'Generic',
          price: Number(formData.price),
          originalPrice: Number(formData.originalPrice || 0),
          imageUrl: mainImage,
          images,
          specs: (formData.specs || '').split(/[|,]/).map((item) => item.trim()).filter(Boolean),
          description: formData.description || 'Professionally tested device ready for sale.',
          accessories: formData.accessories || 'Charger and paperwork',
          condition: formData.condition || 'Good',
          warrantyMonths: Number(formData.warrantyMonths || 0),
          stock: formData.stock || 'In Stock',
          featured: formData.featured === 'true',
          newArrival: formData.newArrival === true || formData.newArrival === 'true',
          deal: formData.deal === true || formData.deal === 'true',
          createdAt: Date.now()
        };
      }

      document.addEventListener('DOMContentLoaded', async () => {
        lucide.createIcons();
        populateCategorySelect();
        clearForm();
        loadAnnouncement();
        await loadProducts();

        document.getElementById('save-announcement-btn').addEventListener('click', () => {
          saveAnnouncement();
        });
        const imageUploadInput = document.getElementById('product-image-upload');
        if (imageUploadInput) {
          imageUploadInput.addEventListener('change', async (event) => {
            await uploadSelectedFiles(event.target.files);
          });
        }

        document.getElementById('product-form').addEventListener('submit', async (event) => {
          event.preventDefault();

          const payload = buildProductPayload({
            id: document.getElementById('product-id').value,
            name: document.getElementById('product-name').value.trim(),
            category: document.getElementById('product-category').value,
            brand: document.getElementById('product-brand').value.trim(),
            price: document.getElementById('product-price').value,
            originalPrice: document.getElementById('product-original-price').value,
            imageUrl: document.getElementById('product-image').value.trim(),
            images: document.getElementById('product-images').value.trim(),
            specs: document.getElementById('product-specs').value,
            description: document.getElementById('product-description').value.trim(),
            accessories: document.getElementById('product-accessories').value.trim(),
            warrantyMonths: document.getElementById('product-warranty').value,
            condition: document.getElementById('product-condition').value,
            stock: document.getElementById('product-stock').value,
            featured: document.getElementById('product-featured').value,
            newArrival: document.getElementById('product-new').checked,
            deal: document.getElementById('product-deal').checked
          });

          if (!payload.name || !payload.price) {
            setSaveStatus('Please enter at least a product name and price.', 'error');
            return;
          }

          const saveButton = getSaveButton();
          if (saveButton) {
            saveButton.disabled = true;
            saveButton.textContent = 'Saving...';
          }
          setSaveStatus('Saving product...', 'info');

          try {
            const docId = payload.id;
            const updatedProducts = products.filter((item) => item.id !== docId);
            updatedProducts.unshift(payload);
            persistProductsToLocal(updatedProducts);
            renderInventory();
            clearForm();

            let firestoreSaved = false;
            try {
              await withTimeout(setDoc(doc(db, 'products', docId), payload, { merge: true }), 8000);
              firestoreSaved = true;
            } catch (firestoreError) {
              if (firestoreError?.message === 'timeout') {
                console.warn('Firestore save timed out, using local storage only.');
              } else {
                console.warn('Firestore save failed, using local storage only:', firestoreError.message);
              }
            }

            if (firestoreSaved) {
              setSaveStatus('Product saved successfully.', 'success');
            } else {
              setSaveStatus('Product saved locally. Firestore sync failed, but the product is visible in this browser.', 'warning');
            }
          } catch (error) {
            console.error('Failed to save product', error);
            setSaveStatus('Error saving product. Please try again.', 'error');
          } finally {
            const saveButton = getSaveButton();
            if (saveButton) {
              saveButton.disabled = false;
              saveButton.textContent = 'Save product';
            }
          }
        });

        document.getElementById('reset-form').addEventListener('click', clearForm);

        document.getElementById('inventory-list').addEventListener('click', async (event) => {
          const editTarget = event.target.closest('[data-edit-product]');
          const deleteTarget = event.target.closest('[data-delete-product]');
          const soldTarget = event.target.closest('[data-sold-product]');
          if (editTarget) {
            const product = products.find((item) => item.id === editTarget.getAttribute('data-edit-product'));
            if (product) {
              document.getElementById('product-id').value = product.id;
              document.getElementById('product-name').value = product.name;
              document.getElementById('product-category').value = product.category;
              document.getElementById('product-brand').value = product.brand || '';
              document.getElementById('product-price').value = product.price;
              document.getElementById('product-original-price').value = product.originalPrice || '';
              document.getElementById('product-image').value = product.imageUrl || '';
              document.getElementById('product-images').value = Array.isArray(product.images) ? product.images.join(', ') : '';
              document.getElementById('product-specs').value = (product.specs || []).join('\n');
              document.getElementById('product-description').value = product.description || '';
              document.getElementById('product-accessories').value = product.accessories || '';
              document.getElementById('product-warranty').value = product.warrantyMonths || '';
              document.getElementById('product-condition').value = product.condition || 'Good';
              document.getElementById('product-stock').value = product.stock || 'In Stock';
              document.getElementById('product-featured').value = String(product.featured ?? true);
              document.getElementById('product-new').checked = Boolean(product.newArrival);
              document.getElementById('product-deal').checked = Boolean(product.deal);
            }
          }
          if (deleteTarget) {
            const id = deleteTarget.getAttribute('data-delete-product');
            products = products.filter((item) => item.id !== id);
            persistProductsToLocal(products);
            renderInventory();
            try {
              await deleteDoc(doc(db, 'products', id));
            } catch (firestoreError) {
              console.warn('Firestore delete failed:', firestoreError.message);
            }
          }
          if (soldTarget) {
            const id = soldTarget.getAttribute('data-sold-product');
            products = products.map((item) => (item.id === id ? { ...item, stock: 'Out of Stock' } : item));
            persistProductsToLocal(products);
            renderInventory();
            setSaveStatus('Product marked out of stock.', 'success');
            try {
              await withTimeout(updateDoc(doc(db, 'products', id), { stock: 'Out of Stock' }), 8000);
            } catch (firestoreError) {
              if (firestoreError?.message === 'timeout') {
                console.warn('Firestore update timed out; local update applied.');
              } else {
                console.warn('Firestore update failed:', firestoreError.message);
              }
            }
          }
        });

        document.getElementById('logout-btn').addEventListener('click', async () => {
          try {
            await signOut(auth);
          } catch (error) {
            console.error('Firebase signOut error:', error);
          }
          localStorage.removeItem('gc_admin_session');
          window.location.href = '../admin-login/index.html';
        });

        onAuthStateChanged(auth, (user) => {
          if (!user) {
            window.location.href = '../admin-login/index.html';
          }
        });
      });
    </script>

  </body>
</html>
